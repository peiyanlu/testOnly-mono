name: Logger

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  logger:
    name: Logger
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      
      - name: Install deps
        run: pnpm install --frozen-lockfile
      
      - run: node .\logger.ts
